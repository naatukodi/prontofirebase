<h2>Case History</h2>

<div *ngIf="loading">Loading history...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<div *ngIf="!loading && history.length === 0">
  No history available.
</div>

<div *ngIf="!loading && history.length > 0" class="history-list">
  <div *ngFor="let item of history" class="history-item" style="border-bottom: 1px solid #ddd; padding: 10px 0;">
    
    <div>
      <strong>{{ item.action }}</strong>
      ({{ item.statusFrom }} → {{ item.statusTo }})
    </div>

    <div>
      👤 {{ item.performedByUserName }}
    </div>

    <div>
      📅 {{ formatDate(item.dateTime) }}
    </div>

    <div *ngIf="item.remarks">
      📝 {{ item.remarks }}
    </div>

  </div>
</div>
<div style="display: flex; justify-content: flex-end; margin-top: 20px;">
  <button mat-raised-button color="primary" (click)="closeDialog()">
    Close
  </button>
</div>
