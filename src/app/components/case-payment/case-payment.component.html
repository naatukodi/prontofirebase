<h2>Payment Details</h2>

<div class="form-group">
  <label>Payment Status *</label>
  <select [(ngModel)]="paymentStatus" [disabled]="!canEdit()">
    <option value="">Select</option>
    <option value="Completed">Completed</option>
    <option value="Pending">Pending</option>
    <option value="Failed">Failed</option>
  </select>
</div>

<div class="form-group">
  <label>Payment Method *</label>
  <select [(ngModel)]="paymentMethod" [disabled]="!canEdit()">
    <option value="">Select</option>
    <option value="Online">Online</option>
    <option value="Cash">Cash</option>
    <option value="UPI">UPI</option>
    <option value="Card">Card</option>
  </select>
</div>

<div class="form-group">
  <label>Payment Reference</label>
  <input type="text"
         [(ngModel)]="paymentReference"
         [readonly]="!canEdit()" />
</div>

<div class="form-group">
  <label>Payment Date *</label>
  <input type="datetime-local"
         [(ngModel)]="paymentDate"
         [readonly]="!canEdit()" />
</div>

<div class="form-group">
  <label>Payment Amount *</label>
  <input type="number"
         [(ngModel)]="paymentAmount"
         [readonly]="!canEdit()" />
</div>

<!-- ✅ NEW PAYMENT NOTES FIELD -->
<div class="form-group">
  <label>Payment Notes</label>
  <textarea rows="4"
            [(ngModel)]="paymentNotes"
            [readonly]="!canEdit()"
            placeholder="Enter payment related notes here...">
  </textarea>
</div>

<br>

<div style="text-align:right;">
  <button mat-raised-button
          color="primary"
          *ngIf="canEdit()"
          (click)="save()"
          [disabled]="saving">
    Save
  </button>

  <button mat-button (click)="dialogRef.close()">
    Close
  </button>
</div>
