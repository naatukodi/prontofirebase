<div class="common-notes-container">

  <div *ngIf="showHeader" class="notes-header">
    <div class="header-title">
      <h3>
        Notes
        <span class="notes-count" *ngIf="!isLoading">
          ({{ getNotesCount() }})
        </span>
      </h3>

      <button
        *ngIf="collapsible"
        class="btn-collapse"
        (click)="toggleCollapse()">
        {{ isCollapsed ? '▶' : '▼' }}
      </button>
    </div>

    <button class="btn-add" (click)="toggleForm()">
      {{ showForm ? '✕ Close' : '+ Add Note' }}
    </button>
  </div>

  <div *ngIf="!isCollapsed || !collapsible" class="notes-content">

    <div *ngIf="error" class="alert alert-error">
      {{ error }}
      <button class="close-btn" (click)="error = null">×</button>
    </div>

    <div *ngIf="isLoading" class="loading">
      Loading notes...
    </div>

    <!-- Add Form -->
    <div *ngIf="showForm && !isLoading" class="add-note-form">
      <textarea
        [(ngModel)]="newNoteText"
        placeholder="Enter your note here..."
        class="note-textarea">
      </textarea>

      <div class="form-buttons">
        <button class="btn-primary" (click)="createNote()">Save Note</button>
        <button class="btn-secondary" (click)="toggleForm()">Cancel</button>
      </div>
    </div>

    <!-- Notes List -->
    <div *ngIf="!isLoading && notes.length === 0 && !showForm" class="empty-state">
      No notes yet. Click "Add Note" to create one.
    </div>

    <div *ngIf="!isLoading" class="notes-list">

      <div *ngFor="let note of notes" class="note-item">

        <!-- View Mode -->
        <div *ngIf="editingNoteId !== note.id" class="note-view">

          <div class="note-content">
            {{ note.note }}
          </div>

          <div class="note-meta">
            <span class="entity-tag">
              {{ note.entityType }}
            </span>

            <span class="creator">
              👤 {{ note.createdBy || 'Unknown User' }}
            </span>

            <span class="date">
              📅 {{ formatDate(note.createdDate) }}
            </span>

            <span *ngIf="note.modifiedDate" class="modified">
              ✏️ {{ formatDate(note.modifiedDate) }}
            </span>
          </div>

          <!-- 🔒 Edit Only If Creator -->
          <div class="note-actions">
            <button
              *ngIf="note.createdBy === currentUser"
              class="btn-edit"
              (click)="startEditing(note)">
              Edit
            </button>
          </div>

        </div>

        <!-- Edit Mode -->
        <div *ngIf="editingNoteId === note.id" class="note-edit">
          <textarea
            [(ngModel)]="editNoteText"
            class="note-textarea">
          </textarea>

          <div class="form-buttons">
            <button class="btn-primary" (click)="updateNote(note.id)">
              Save
            </button>
            <button class="btn-secondary" (click)="cancelEditing()">
              Cancel
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
