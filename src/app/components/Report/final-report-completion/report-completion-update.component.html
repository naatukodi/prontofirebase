<div class="pg-wrap">
<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <app-workflow-buttons
    [id]="valuationId"
    [vehicleNumber]="vehicleNumber"
    [applicantContact]="applicantContact"
    [valuationType]="valuationType">
  </app-workflow-buttons>

  <div *ngIf="loading" class="pg-loading">Loading…</div>
  <div *ngIf="error" class="pg-error">{{ error }}</div>

  <div class="pg-content">
  <ng-container *ngIf="!loading && !error">
    <fieldset class="nested-group">
      <legend>Completion Details</legend>

      <div class="grid">

        <mat-form-field appearance="fill">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status" required>
            <mat-option value="Completed">Completed</mat-option>
            <mat-option value="Pending">Pending</mat-option>
            <mat-option value="Rejected">Rejected</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('status')?.hasError('required')">Status is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Completed At</mat-label>
          <input matInput type="datetime-local" formControlName="completedAt" />
          <mat-error *ngIf="form.get('completedAt')?.hasError('required')">Completed At is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Completed By</mat-label>
          <input matInput formControlName="completedBy" />
          <mat-error *ngIf="form.get('completedBy')?.hasError('required')">Completed By is required</mat-error>
        </mat-form-field>

      </div>
    </fieldset>

    <!-- ADD REMARKS SECTION -->
    <fieldset class="nested-group">
      <legend>Remarks</legend>
      <div class="grid">
        <mat-form-field appearance="fill" style="width: 100%;">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" rows="3"></textarea>
        </mat-form-field>
      </div>
    </fieldset>

    <!-- ACTION BUTTONS -->
    <fieldset>
      <div class="button-group" style="margin-top: 1rem; display: flex; gap: 1rem;">
        <button
          mat-raised-button
          color="accent"
          type="button"
          [disabled]="saving"
          (click)="onSaveDraft()">
          {{ saving && saveInProgress ? 'Saving…' : 'Save Draft' }}
        </button>
      
        <!-- NEW: SUBMIT FOR REVIEW -->
        <button
          mat-raised-button
          color="primary"
          type="button"
          [disabled]="saving"
          (click)="onSubmitForReview()">
          {{ saving && submitInProgress ? 'Submitting…' : 'Submit for Review' }}
        </button>
      
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="saving">
          {{ saving && submitInProgress ? 'Submitting…' : 'Submit as Complete' }}
        </button>

        <button
          mat-raised-button
          color="warn"
          type="button"
          [disabled]="saving"
          (click)="onCancel()">
          Cancel
        </button>
      </div>
    </fieldset>
  </ng-container>
  </div><!-- /pg-content -->
</form>
</div><!-- /pg-wrap -->

<router-outlet></router-outlet>
