name: Deploy to Firebase Hosting on merge
# Production deploys happen only from main. Work lands on release, then reaches
# main through a reviewed pull request — pushing to release no longer goes live.
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build -- --configuration=production
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRONTOFIREBASE }}
          channelId: live
          projectId: prontofirebase
